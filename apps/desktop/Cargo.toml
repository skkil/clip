[package]
name = "clip-desktop"
description = "CLIP desktop client: screen capture, OCR and the background daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
clip-ocr = { path = "../shared/ocr" }
fontdue = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
interprocess = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
smithay-client-toolkit = "0.21.1"
tokio = { version = "1", features = ["rt"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wl-clipboard-rs = "0.9.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
